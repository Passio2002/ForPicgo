e" fill="#17202b" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="400">21</text><text x="184" y="210" text-anchor="middle" fill="#17202b" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="400">14q：2份；21q：2份</text><text x="552" y="210" text-anchor="middle" fill="#17202b" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="400">14q：2份；21q：2份</text><path d="M184 225V250" marker-end="url(#down-inheritance-arrow)" fill="none" stroke="#17202b" stroke-width="1.5" /><path d="M552 225V250" marker-end="url(#down-inheritance-arrow)" fill="none" stroke="#17202b" stroke-width="1.5" /><text x="184" y="275" text-anchor="middle" fill="#17202b" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="500">卵子：本例的一种分配</text><text x="184" y="298" text-anchor="middle" fill="#17202b" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="400">带走融合染色体＋正常21</text><text x="552" y="275" text-anchor="middle" fill="#17202b" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="500">正常精子</text><text x="552" y="298" text-anchor="middle" fill="#17202b" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="400">带走正常14＋正常21</text><rect x="106.76" y="313" width="22" height="50" rx="8" fill="#287bca" /><rect x="106.76" y="375" width="22" height="35" rx="8" fill="#d78c32" /><circle cx="117.76" cy="369" r="6" fill="#17202b" /><text x="117.76" y="447" text-anchor="middle" fill="#17202b" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="400">融合</text><rect x="239.24" y="347" width="22" height="16" rx="7" fill="#d78c32" /><rect x="239.24" y="375" width="22" height="35" rx="8" fill="#d78c32" /><circle cx="250.24" cy="369" r="